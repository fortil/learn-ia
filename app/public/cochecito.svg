    <circle cx="216" cy="152" r="24" fill="#26233F"/>
    <circle cx="216" cy="152" r="10" fill="#FFFFFF" stroke-width="4"/>
    <!-- wheel sparkle -->
    <path d="M80 146 l6 6 M92 146 l-6 6" stroke="#FFFFFF" stroke-width="3"/>
    <!-- motion dashes -->
    <path d="M6 120 h14 M2 140 h16" fill="none" stroke="#FF6B4A" stroke-width="5"/>
  </g>
</svg>
