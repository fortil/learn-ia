    <rect x="34" y="58" width="58" height="48" rx="10" fill="#FFC53D"/>
    <path d="M55 76 c0-8 14-8 14 0 c0 6-7 6-7 12" fill="none" stroke-width="5"/>
    <circle cx="62" cy="96" r="3" fill="#26233F" stroke="none"/>
    <!-- car body -->
    <path d="M28 128
             C 28 112, 40 104, 60 102
             L 96 98
             C 110 74, 132 62, 162 62
             C 196 62, 216 78, 226 100
             L 252 106
             C 266 110, 272 118, 272 128
             L 272 140
